<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better by Design: Visual Communication for the Modern Educator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F7FC;
    --surface: #FFFFFF;
    --surface-alt: #F0F3FB;
    --border: #DCE2F2;
    --text: #1B2140;
    --text-muted: #5B6485;
    --primary: #2358CF;
    --primary-dark: #17409A;
    --primary-soft: #E7EDFC;
    --secondary: #0D9488;
    --secondary-soft: #E1F5F2;
    --focal: #F97316;
    --focal-soft: #FEEADA;
    --good: #0D9488;
    --bad: #D6432B;
    --ok: #B4740E;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 16px rgba(27,33,64,0.06), 0 1px 3px rgba(27,33,64,0.06);
    --shadow-lift: 0 10px 30px rgba(27,33,64,0.10), 0 2px 6px rgba(27,33,64,0.08);
    --font-body: 'Montserrat', system-ui, sans-serif;
  }
  :root[data-theme="dark"]{
    --bg: #10162B;
    --surface: #1A2242;
    --surface-alt: #202A4E;
    --border: #313D66;
    --text: #EDEFF9;
    --text-muted: #A8B0D6;
    --primary: #6E97F5;
    --primary-dark: #4472E0;
    --primary-soft: #22305E;
    --secondary: #2DD4BF;
    --secondary-soft: #163732;
    --focal: #FB923C;
    --focal-soft: #3A2718;
    --good: #2DD4BF;
    --bad: #F4796A;
    --ok: #F2C078;
    --shadow: 0 4px 16px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.24);
    --shadow-lift: 0 10px 30px rgba(0,0,0,0.38), 0 2px 6px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-width: 1280px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 32px 80px;
  }
  a{color: var(--primary);}

  /* Header */
  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 24px;
    margin-bottom: 28px;
  }
  .brand h1{
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 4px;
    color: var(--primary);
    letter-spacing: -0.01em;
  }
  .brand p{
    margin: 0;
    color: var(--text-muted);
    font-size: 14.5px;
    font-weight: 500;
    max-width: 640px;
  }
  .theme-toggle{
    flex-shrink: 0;
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .theme-toggle:hover{ border-color: var(--primary); }

  /* Instructions banner */
  .howto{
    background: var(--primary-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin-bottom: 26px;
  }
  .howto h2{
    margin:0 0 8px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--primary);
    font-weight: 800;
  }
  .howto ol{
    margin: 0;
    padding-left: 20px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 28px;
  }
  .howto li{ font-size: 14px; color: var(--text); padding: 3px 0; }
  .howto.compact{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding: 12px 20px;}
  .howto.compact p{ margin:0; font-size: 13.5px; color: var(--text-muted); }
  .howto.compact button{
    background: none; border: none; color: var(--primary); font-family: inherit;
    font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
  }

  /* Progress */
  .progress{ margin-bottom: 30px; }
  .progress-label{
    font-size: 13px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .progress-track{ display:flex; gap: 8px; }
  .progress-seg{
    flex:1; height: 7px; border-radius: 999px; background: var(--border);
    position: relative; overflow: hidden;
  }
  .progress-seg.done, .progress-seg.active{ background: var(--primary); }
  .progress-steps{
    display:flex; justify-content:space-between; margin-top: 8px;
  }
  .progress-steps span{ font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .progress-steps span.current{ color: var(--primary); }

  /* Card / step shell */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
    box-shadow: var(--shadow);
  }
  .step-eyebrow{
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--secondary); margin: 0 0 6px;
  }
  .step-title{ font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .step-sub{ font-size: 14.5px; color: var(--text-muted); margin: 0 0 24px; max-width: 680px; }

  /* Option grids */
  .option-grid{ display:grid; gap: 14px; margin-bottom: 8px; }
  .option-grid.cols-3{ grid-template-columns: repeat(3, 1fr); }
  .option-grid.cols-4{ grid-template-columns: repeat(4, 1fr); }
  .option{
    border: 2px solid var(--border);
    background: var(--surface-alt);
    border-radius: var(--radius-md);
    padding: 18px 18px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    transition: border-color .12s ease, transform .05s ease;
    display:flex; flex-direction:column; gap: 6px;
  }
  .option:hover{ border-color: var(--primary); }
  .option.selected{
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .option .opt-title{ font-weight: 700; font-size: 15.5px; display:flex; align-items:center; gap:8px;}
  .option .opt-desc{ font-size: 13px; color: var(--text-muted); line-height:1.4; }
  .option .check{
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border);
    flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    font-size: 13px; color: #fff; background: var(--surface);
  }
  .option.selected .check{ background: var(--primary); border-color: var(--primary); }
  .option-grid.cols-3 .option .check{ border-radius: 999px; }

  .note{ font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .canva-toggle{ width: 100%; margin-top: 14px; }
  .warning{
    margin-top: 14px; background: var(--focal-soft); border: 1px solid var(--focal);
    color: var(--text); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px;
    font-weight: 600; display:flex; gap:8px; align-items:flex-start;
  }
  .info-box{
    margin-top: 14px; background: var(--primary-soft); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px;
    line-height: 1.5;
  }

  /* Nav buttons */
  .step-nav{ display:flex; justify-content:space-between; align-items:center; margin-top: 30px; }
  .btn{
    font-family: inherit; font-weight: 700; font-size: 14.5px; border-radius: 999px;
    padding: 12px 24px; cursor: pointer; border: 2px solid transparent; transition: opacity .12s ease, transform .05s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--primary); color: #fff; }
  .btn-primary:hover{ background: var(--primary-dark); }
  .btn-primary:disabled{ opacity: 0.4; cursor:not-allowed; }
  .btn-ghost{ background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover{ border-color: var(--primary); color: var(--primary); }
  .btn-focal{ background: var(--focal); color: #fff; }
  .btn-focal:hover{ opacity: 0.9; }
  .btn-link{ background:none; border:none; color: var(--primary); font-weight:700; font-family:inherit; cursor:pointer; font-size: 14px; padding: 6px 0;}
  .btn-sm{ padding: 8px 14px; font-size: 13px; }

  /* Step 4 palette picker */
  .palette-picker{ margin-bottom: 20px; }
  .palette-grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 6px; }
  .palette-card{
    border: 2px solid var(--border); background: var(--surface-alt); border-radius: var(--radius-md);
    padding: 12px 10px; cursor:pointer; font-family: inherit; display:flex; flex-direction:column;
    align-items:center; gap: 8px; text-align:center; transition: border-color .12s ease;
  }
  .palette-card:hover{ border-color: var(--primary); }
  .palette-card.selected{ border-color: var(--primary); background: var(--primary-soft); }
  .swatch-row{ display:flex; gap: 4px; }
  .swatch{ width: 16px; height:16px; border-radius:50%; display:inline-block; }
  .swatch-neutral{ border: 1px solid var(--border); }
  .palette-name{ font-size: 11.5px; font-weight: 700; color: var(--text); line-height:1.3; }

  /* Step 4 defaults panel */
  .defaults-panel{
    border: 2px solid var(--primary); background: var(--primary-soft);
    border-radius: var(--radius-md); padding: 22px 24px; display:flex; align-items:center;
    justify-content: space-between; gap: 20px; margin-bottom: 18px;
  }
  .defaults-panel .txt strong{ display:block; font-size: 15.5px; margin-bottom: 3px; }
  .defaults-panel .txt span{ font-size: 13px; color: var(--text-muted); }
  .or-divider{ display:flex; align-items:center; gap:14px; margin: 20px 0; color: var(--text-muted); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .or-divider::before, .or-divider::after{ content:""; flex:1; height:1px; background: var(--border); }

  .custom-form{ display:none; }
  .custom-form.open{ display:block; }
  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; margin-bottom: 22px; }
  .field label{ display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .field input[type="text"], .field select{
    width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px;
    border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text);
  }
  .field input[type="text"]:focus, .field select:focus{ outline: 2px solid var(--primary); outline-offset: 1px; }
  .chip-row-wrap{ display:flex; flex-wrap:wrap; gap: 6px; margin-top: 8px; }
  .chip-btn{
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted);
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor:pointer;
  }
  .chip-btn:hover{ border-color: var(--primary); color: var(--primary); }
  .color-field{ display:flex; align-items:center; gap: 8px; }
  .color-field input[type="color"]{
    width: 42px; height: 40px; padding: 0; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    cursor:pointer; background:none;
  }
  .color-field input[type="text"]{ flex:1; }

  /* Live preview */
  .preview-wrap{ margin-top: 8px; }
  .preview-label{ font-size: 13px; font-weight: 800; text-transform:uppercase; letter-spacing:.05em; color: var(--text-muted); margin-bottom: 10px;}
  .preview-card{
    border-radius: var(--radius-lg); padding: 26px 28px; border: 1px solid var(--border);
    box-shadow: var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  .preview-title{ font-size: 22px; font-weight: 800; margin:0; }
  .preview-body{ font-size: 14px; margin:0; max-width: 520px; }
  .preview-row{ display:flex; align-items:center; gap:14px; margin-top: 6px; flex-wrap:wrap; }
  .preview-btn{ padding: 10px 20px; border-radius: 999px; font-weight:700; font-size: 13.5px; border:none; display:inline-block;}
  .preview-tag{ padding: 5px 12px; border-radius: 999px; font-weight:700; font-size: 12px; }
  .preview-graphic{ width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; }
  .badges{ display:flex; gap: 8px; margin-top: 12px; flex-wrap:wrap; }
  .badge{ font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge.good{ background: rgba(13,148,136,0.15); color: var(--good); }
  .badge.ok{ background: rgba(180,116,14,0.15); color: var(--ok); }
  .badge.bad{ background: rgba(214,67,43,0.15); color: var(--bad); }

  /* Output screen */
  .output-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px; gap: 20px;}
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin: 14px 0 0; }
  .chip{ background: var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:700; color: var(--text-muted); }
  .section-heading{ font-size: 13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color: var(--secondary); margin: 36px 0 4px; }
  .section-heading:first-of-type{ margin-top: 30px; }
  .section-sub{ font-size: 14px; color: var(--text-muted); margin: 0 0 18px; }
  .tool-block{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md);
    padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .tool-block h3{ margin: 0 0 12px; font-size: 16px; display:flex; align-items:center; gap:8px; }
  .tool-block ol{ margin: 0; padding-left: 20px; }
  .tool-block li{ font-size: 14px; margin-bottom: 8px; line-height: 1.55; }
  .tool-block li:last-child{ margin-bottom: 0; }
  .prompt-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md);
    margin-bottom: 18px; overflow:hidden; box-shadow: var(--shadow);
  }
  .prompt-card-head{
    display:flex; justify-content:space-between; align-items:center; padding: 14px 20px;
    background: var(--surface-alt); border-bottom: 1px solid var(--border);
  }
  .prompt-card-head h3{ margin:0; font-size: 14.5px; }
  .prompt-card pre{
    margin:0; padding: 20px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-size: 12.8px; white-space: pre-wrap; word-wrap: break-word; color: var(--text);
    max-height: 360px; overflow-y: auto; line-height:1.6;
  }
  .copy-btn{
    background: var(--primary); color:#fff; border:none; border-radius: 999px; padding: 8px 18px;
    font-family: inherit; font-weight:700; font-size: 12.8px; cursor:pointer; flex-shrink:0;
  }
  .copy-btn.copied{ background: var(--good); }

  .final-actions{ display:flex; justify-content:space-between; margin-top: 36px; }
  footer{ text-align:center; color: var(--text-muted); font-size:12.5px; margin-top: 50px; }

  .download-row{ display:flex; justify-content:flex-end; margin: -4px 0 4px; }
  .btn-download{ background: var(--secondary); color:#fff; }
  .btn-download:hover{ opacity:0.9; }
  .print-header{ display:none; }

  @media print{
    /* Force light, readable colors regardless of on-screen dark mode --
       dark-mode text is near-white and would be invisible on a forced
       white printed/PDF background otherwise. */
    body, .card, .tool-block, .prompt-card, .chip, .step-title, .step-sub,
    .section-sub, .opt-desc, li, pre, h1, h2, h3, p, span{
      color: #1B2140 !important;
    }
    body{ min-width: 0; background:#fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap{ max-width: 100%; padding: 0 12px; }
    button, .theme-toggle, .howto, .progress, .step-nav, .final-actions, .download-row, footer{ display:none !important; }
    .output-header{ display:block; }
    .brand p{ color:#5B6485 !important; }
    .card{ box-shadow:none; border:none; padding: 0; background:#fff !important; }
    .tool-block, .prompt-card{ box-shadow:none; break-inside: avoid; background:#fff !important; border:1px solid #DCE2F2 !important; }
    .prompt-card-head{ background:#F0F3FB !important; }
    .chip{ background:#F0F3FB !important; border:1px solid #DCE2F2 !important; }
    .section-heading{ color:#0D9488 !important; }
    .step-eyebrow{ color:#0D9488 !important; }
    .prompt-card pre{ max-height:none; overflow: visible; }
    .print-header{
      display:block; font-size: 12px; color:#5B6485 !important; margin-bottom: 10px;
      border-bottom: 1px solid #DCE2F2; padding-bottom: 8px;
    }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){

  /* ---------------------------------------------------------------------
     STATE
  --------------------------------------------------------------------- */
  var DEFAULT_BRANDING = {
    titleFont: "Montserrat (if available), Arial",
    bodyFont: "Montserrat (if available), Arial",
    primaryColor: "#2358CF",
    secondaryColor: "#0D9488",
    neutralColor: "#F8F9FF",
    focalColor: "#F97316",
    graphicStyle: "Minimal arrows and dividers"
  };

  var state = {
    screen: "welcome",       // welcome | 1 | 2 | 3 | 4 | output
    deliverable: null,       // slides | document | both
    tool: null,              // claude | chatgpt | copilot
    canva: false,            // optional Canva connector add-on
    task: null,              // generate | improve | agent
    customizing: false,
    branding: Object.assign({}, DEFAULT_BRANDING),
    selectedPalette: "signature", // id into PALETTES, or null once colors are hand-edited
    theme: "light"
  };

  var STEP_LABELS = ["What to make", "AI tool(s)", "Your goal", "Branding"];

  // Free-text suggestions shown as quick-fill chips under the Graphic Style field.
  var GRAPHIC_SUGGESTIONS = [
    "Simple line icons",
    "Filled geometric shapes",
    "Minimal arrows and dividers",
    "No graphics, text only",
    "I am not sure yet"
  ];

  // Curated starting palettes, each checked for accessible contrast (title vs.
  // background, body ink vs. background, and auto-picked button text vs. focal
  // color all clear WCAG AA). Selecting one fills in all four color fields as
  // a starting point -- every field stays fully editable afterward.
  var PALETTES = {
    signature: { name: "Signature Blue & Teal", primary:"#2358CF", secondary:"#0D9488", neutral:"#F8F9FF", focal:"#F97316" },
    purple:    { name: "Deep Purple & Gold",    primary:"#6D28D9", secondary:"#B45309", neutral:"#FAF7FF", focal:"#EA580C" },
    forest:    { name: "Forest & Amber",        primary:"#166534", secondary:"#A16207", neutral:"#F6FAF6", focal:"#EA580C" },
    slate:     { name: "Slate & Coral",         primary:"#334155", secondary:"#0EA5E9", neutral:"#F8FAFC", focal:"#E8543F" },
    crimson:   { name: "Crimson & Charcoal",    primary:"#9F1D31", secondary:"#3F3F46", neutral:"#FAFAFA", focal:"#D4A017" }
  };

  var DELIVERABLE_META = {
    slides:   { label: "slide deck", outline: "slide deck outline", agentToken: "SLIDE DECK OUTLINE" },
    document: { label: "document or assignment brief", outline: "document outline", agentToken: "DOCUMENT OUTLINE" },
    both:     { label: "slide deck and document", outline: "slide deck outline and document outline", agentToken: "SLIDE DECK AND DOCUMENT OUTLINE" }
  };

  var TOOL_META = {
    claude:  { name: "Claude" },
    chatgpt: { name: "ChatGPT" },
    copilot: { name: "Microsoft Copilot" },
    canva:   { name: "Canva" }
  };

  var app = document.getElementById("app");

  /* ---------------------------------------------------------------------
     HELPERS
  --------------------------------------------------------------------- */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function normalizeHex(v){
    v = (v || "").trim();
    if(v[0] !== "#") v = "#" + v;
    return v;
  }

  function isValidHex(v){
    return /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(v);
  }

  function hexToRgb(hex){
    var h = hex.replace("#","");
    if(h.length === 3){ h = h.split("").map(function(c){return c+c;}).join(""); }
    var num = parseInt(h,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  function luminance(hex){
    var rgb = hexToRgb(hex);
    var a = [rgb.r, rgb.g, rgb.b].map(function(v){
      v /= 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2];
  }

  function contrastRatio(hex1, hex2){
    var l1 = luminance(hex1) + 0.05;
    var l2 = luminance(hex2) + 0.05;
    return l1 > l2 ? l1/l2 : l2/l1;
  }

  function bestTextColor(bgHex){
    return contrastRatio(bgHex, "#ffffff") >= contrastRatio(bgHex, "#111111") ? "#ffffff" : "#111111";
  }

  function contrastBadge(ratio){
    if(ratio >= 4.5) return {text:"Accessible contrast ✓", cls:"good"};
    if(ratio >= 3) return {text:"OK for large text only ⚠", cls:"ok"};
    return {text:"Low contrast ✕ try adjusting", cls:"bad"};
  }

  function parseFontCss(fontString){
    var first = (fontString || "").split("(")[0].trim().split(",")[0].trim();
    if(!first) first = "Montserrat";
    if(first.indexOf(" ") > -1) first = '"' + first + '"';
    return first + ", Arial, sans-serif";
  }

  function copyToClipboard(text, btn){
    function ok(){
      var original = btn.textContent;
      btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = original; btn.classList.remove("copied"); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(function(){ fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  }

  function fallbackCopy(text, ok){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){}
    document.body.removeChild(ta);
  }

  };

  // Graphic Style is now free text, so the preview icon is chosen by loose
  // keyword match against the five canonical suggestions, falling back to a
  // generic placeholder icon for anything custom the user types.
  function pickGraphicIconKey(text){
    var t = (text || "").toLowerCase();
    if(t.indexOf("no graphic") > -1 || t.indexOf("text only") > -1) return "none";
    if(t.indexOf("line") > -1) return "line";
    if(t.indexOf("geometric") > -1 || t.indexOf("shape") > -1) return "geometric";
    if(t.indexOf("arrow") > -1 || t.indexOf("divider") > -1) return "arrows";
    return "unsure";
  }

  function wireStep4Inputs(){
    ["titleFont","bodyFont"].forEach(function(f){
      var el = document.getElementById("f-" + f);
      if(el) el.addEventListener("input", function(){ state.branding[f] = el.value; updatePreview(); });
    });
    ["primaryColor","secondaryColor","neutralColor","focalColor"].forEach(function(f){
      var colorEl = document.getElementById("c-" + f);
      var hexEl = document.getElementById("h-" + f);
      if(colorEl) colorEl.addEventListener("input", function(){
        state.branding[f] = colorEl.value;
        hexEl.value = colorEl.value;
        state.selectedPalette = null; // hand-edited: no longer an exact preset match
        updatePreview();
      });
      if(hexEl) hexEl.addEventListener("input", function(){
        var v = normalizeHex(hexEl.value);
        if(isValidHex(v)){ state.branding[f] = v; colorEl.value = v; state.selectedPalette = null; updatePreview(); }
      });
      if(hexEl) hexEl.addEventListener("blur", function(){
        if(!isValidHex(normalizeHex(hexEl.value))) hexEl.value = state.branding[f];
      });
    });
    var gs = document.getElementById("f-graphicStyle");
    if(gs) gs.addEventListener("input", function(){ state.branding.graphicStyle = gs.value; updatePreview(); });
  }

  function updatePreview(){
    var b = state.branding;
    var card = document.getElementById("previewCard");
    if(!card) return;
    card.style.background = b.neutralColor;
    var titleEl = document.getElementById("previewTitle");
    titleEl.style.color = b.primaryColor;
    titleEl.style.fontFamily = parseFontCss(b.titleFont);
    var bodyEl = document.getElementById("previewBody");
    var ink = "#1F2937";
    bodyEl.style.color = ink;
    bodyEl.style.fontFamily = parseFontCss(b.bodyFont);
    var btn = document.getElementById("previewButton");
    btn.style.background = b.focalColor;
    btn.style.color = bestTextColor(b.focalColor);
    btn.style.fontFamily = parseFontCss(b.bodyFont);
    var tag = document.getElementById("previewTag");
    tag.style.background = b.secondaryColor;
    tag.style.color = bestTextColor(b.secondaryColor);
    tag.style.fontFamily = parseFontCss(b.bodyFont);
    var g = document.getElementById("previewGraphic");
    g.innerHTML = (GRAPHIC_SVG[pickGraphicIconKey(b.graphicStyle)] || "").split("CUR").join(b.primaryColor);

    var titleRatio = contrastRatio(b.primaryColor, b.neutralColor);
    var bodyRatio = contrastRatio(ink, b.neutralColor);
    var btnRatio = contrastRatio(bestTextColor(b.focalColor), b.focalColor);
    var tb = contrastBadge(titleRatio), bb = contrastBadge(bodyRatio), ub = contrastBadge(btnRatio);
    document.getElementById("previewBadges").innerHTML =
      '<span class="badge ' + tb.cls + '">Title: ' + tb.text + '</span>' +
      '<span class="badge ' + bb.cls + '">Body: ' + bb.text + '</span>' +
      '<span class="badge ' + ub.cls + '">Button: ' + ub.text + '</span>';

    // Keep the palette-card highlight honest after a hand-edit clears it,
    // without a full re-render (which would drop input focus mid-keystroke).
    document.querySelectorAll(".palette-card").forEach(function(el){
      el.classList.toggle("selected", el.getAttribute("data-palette") === state.selectedPalette);
    });
  }

  function downloadPdf(){
    // No backend and no bundled PDF library — the browser's own print-to-PDF
    // does the job with zero dependencies. The print stylesheet above hides
    // all navigation/chrome and expands the prompt boxes so everything fits.
    window.print();
  }

  /* ---------------------------------------------------------------------
     CONTENT: COPY-PASTE PROMPTS
  --------------------------------------------------------------------- */
  // Concrete, checkable hierarchy rules -- a one-line "strong visual
  // hierarchy" instruction reliably produces generic, flat-looking output
  // (confirmed via live testing), so every prompt spells out exactly what
  // hierarchy means: relative sizes, how subtitles are used, bullet limits,
  // and restraint on the accent color.
  function visualHierarchyRules(){
    return "  - Titles: large, bold, and clearly the biggest text on the slide or page, set in the Title Font and Primary Color.\n" +
      "  - Subtitles/section headers: a consistent, distinct style -- smaller than titles, larger than body text -- used the same way every time to signal a new idea or section.\n" +
      "  - Body text and bullets: noticeably smaller than titles/subtitles, in the Body Font, with one clear idea per slide or section and no more than 5-6 short bullets -- split up dense content across multiple slides/sections rather than shrinking text to fit.\n" +
      "  - Focal/Contrast Color: used sparingly, only on the single most important element per slide or section (a key stat, a call-to-action, a label) -- never as a general accent.\n" +
      "  - Generous, consistent margins and white space around all text -- avoid cramped, edge-to-edge layouts.\n" +
      "  - Identical treatment for repeating elements (e.g., every section-header slide, every callout box) so the design feels like one system, not ad hoc.\n" +
      "  - All color and text combinations must meet accessible contrast standards.";
  }

  // Confirm-before-delivering self-check -- a known reliability technique:
  // giving the model a concrete checklist to run against its own draft catches
  // exactly the generic, flat output the one-line instructions were producing.
  function qualityCheckBlock(){
    return "- Every title is clearly the largest, boldest text on its slide or page.\n" +
      "- No slide or section has more than 5-6 bullets, or a dense paragraph.\n" +
      "- The Focal/Contrast Color appears on at most one element per slide or section — not as a general accent.\n" +
      "- Fonts and colors match the brand guidelines exactly, throughout.\n" +
      "- The output is an actual downloadable file (or you've clearly said why not, with a text outline as a fallback).";
  }

  function brandBlock(b){
    return "- Title Font: " + b.titleFont + "\n" +
      "- Body Font: " + b.bodyFont + "\n" +
      "- Primary Color: " + b.primaryColor + "\n" +
      "- Secondary Color: " + b.secondaryColor + "\n" +
      "- Background/Neutral Color: " + b.neutralColor + "\n" +
      "- Focal/Contrast Color: " + b.focalColor + "\n" +
      "- Graphic Style: " + b.graphicStyle + "\n" +
      "- Visual Approach: Modern and minimal, with strong, deliberate visual hierarchy:\n" + visualHierarchyRules();
  }

  function formatBlock(deliverable){
    var slideFmt = "For each slide, use this format:\nSlide [Number]\nTitle: [Slide title]\nBullets: [Short bullet points, no more than 5-6 per slide — no dense paragraphs]\nSpeaker Notes: [Any detail that belongs in spoken delivery, not on the slide]";
    var docFmt = "For each section, use this format:\nSection [Number]\nHeading: [Section heading]\nBody: [Clear, scannable prose or bullets as appropriate]\nDesign Note: [How this section should be visually treated — e.g., a table, callout box, or bulleted list]";
    if(deliverable === "slides") return slideFmt;
    if(deliverable === "document") return docFmt;
    return "For the slide deck:\n" + slideFmt + "\n\nFor the document:\n" + docFmt;
  }

  // The name of the actual file format(s) this deliverable should end up as —
  // used to tell the AI explicitly not to stop at a text outline.
  function fileWord(deliverable){
    if(deliverable === "document") return "Word";
    if(deliverable === "slides") return "PowerPoint";
    return "PowerPoint and Word";
  }

  // A complete, correctly-pluralized noun phrase (with its own article, or
  // none for the plural "both" case) -- drop this straight into a sentence
  // rather than gluing "a/an" + fileWord(deliverable) + "file" together,
  // which reads as "a PowerPoint and Word file" (wrong) for "both".
  function filePhrase(deliverable){
    if(deliverable === "slides") return "a downloadable PowerPoint file";
    if(deliverable === "document") return "a downloadable Word file";
    return "downloadable PowerPoint and Word files";
  }

  function fileDeliverableNote(deliverable){
    var slideNote = "For the slide deck, use the bullets as genuine slide content and put speaker notes in the slide's notes field (not printed on the slide itself).";
    var docNote = "For the document, use real headings and paragraph styles to build the structure (not just bold text), so it behaves like a properly formatted Word document, not a plain text file.";
    var howTo = deliverable === "slides" ? slideNote : (deliverable === "document" ? docNote : slideNote + " " + docNote);
    var fileNoun = deliverable === "both" ? "files" : "file";
    var article = deliverable === "both" ? "" : "a ";
    return "Once the structure above is confirmed, generate the actual " + fileNoun + " — " + article + "real " + fileWord(deliverable) + " " + fileNoun + ", not just a text outline. " + howTo + " Provide " + (deliverable === "both" ? "them" : "it") + " as " + (deliverable === "both" ? "files" : "a file") + " I can download. If you're not able to generate a downloadable file directly, say so plainly, then give me the same content as a text outline instead so I can copy it in by hand.";
  }

  function generatePromptText(deliverable, b){
    var dm = DELIVERABLE_META[deliverable];
    return "ROLE\n" +
      "You are an expert presentation and document designer helping a college instructor turn a rough idea into a polished, well-designed " + dm.outline + ".\n\n" +
      "CONTEXT\n" +
      "This will be used in a college course, so it needs to hold up visually in front of a class or as a handout — not just read correctly as text.\n\n" +
      "BRAND GUIDELINES\n" + brandBlock(b) + "\n\n" +
      "BEFORE YOU BEGIN\n" +
      "Ask me:\n1. Who is the audience?\n2. How many slides or sections should this target?\n3. What tone should it use?\n" +
      "Don't guess at these — wait for my answer if I haven't already told you.\n\n" +
      "PROCESS\n" +
      "1. Once I answer, briefly summarize the structure you're planning (a short numbered list) so I can confirm or redirect it before you build the full thing.\n" +
      "2. After I confirm, generate the complete " + dm.outline + " using the OUTPUT FORMAT below.\n" +
      "3. Before showing me the final version, run it through the QUALITY CHECK below and fix anything that doesn't pass.\n\n" +
      "OUTPUT FORMAT\n" + formatBlock(deliverable) + "\n\n" +
      "OUTPUT DELIVERABLE\n" + fileDeliverableNote(deliverable) + "\n\n" +
      "QUALITY CHECK — confirm all of these before presenting your final version:\n" + qualityCheckBlock() + "\n\n" +
      "SOURCE MATERIAL\n[PASTE YOUR IDEA OR OUTLINE HERE]";
  }

  function improvePromptText(deliverable, b){
    var dm = DELIVERABLE_META[deliverable];
    return "ROLE\n" +
      "You are an expert presentation and document designer conducting a design review.\n\n" +
      "CONTEXT\n" +
      "I've attached a " + dm.label + " I already created for a college course. I want it critiqued and improved, not rewritten from scratch — keep my content and message intact unless I specifically ask you to change it.\n\n" +
      "BRAND GUIDELINES (evaluate against this visual identity)\n" + brandBlock(b) + "\n\n" +
      "PROCESS\n" +
      "Review the attached file specifically for:\n" +
      "1. Visual hierarchy — are titles clearly the biggest, boldest element? Is there a consistent subtitle/section-header style? Are bullets short and few enough per slide or section (5-6 max)?\n" +
      "2. Color use — do the colors match the brand guidelines? Is the Focal/Contrast Color used sparingly, on one thing at a time, rather than as a general accent?\n" +
      "3. Typography — are the Title Font and Body Font used consistently and distinctly from each other?\n" +
      "4. Spacing and consistency — is there enough white space? Do repeating elements (section dividers, callout boxes) look identical to one another throughout?\n\n" +
      "OUTPUT FORMAT\n" +
      "Give me:\n1. What's already working well (2-3 specific things).\n2. A numbered, prioritized list of changes — most visually impactful first — each with a one-line reason tied to the brand guidelines above.\n3. Anything inconsistent from one slide or section to the next.\n\n" +
      "OUTPUT DELIVERABLE\n" +
      "If you're able to edit the uploaded file directly, do so and give me back an updated, downloadable file. Otherwise, keep your suggestions concrete enough that I could hand them to a designer, or apply them myself.";
  }

  function agentPromptText(deliverable, b){
    var dm = DELIVERABLE_META[deliverable];
    var outputSections = "";
    if(deliverable === "slides" || deliverable === "both"){
      outputSections += "OUTPUT FORMAT — SLIDE DECK\nFor each slide use this format:\nSlide [Number]\nTitle: [Slide title]\nBullets: [Short bullet points, no more than 5-6 per slide — no dense paragraphs]\nSpeaker Notes: [Any detail that belongs in spoken delivery, not on the slide]\nUse section header slides to separate major parts when the source has more than three distinct sections.\n\n";
    }
    if(deliverable === "document" || deliverable === "both"){
      outputSections += "OUTPUT FORMAT — DOCUMENT OR ASSIGNMENT BRIEF\nFor each section use this format:\nSection [Number]\nHeading: [Section heading]\nBody: [Clear, scannable prose or bullets as appropriate]\nDesign Note: [Any note about how this section should be visually treated — e.g. use a table, callout box, or bulleted list]\n\n";
    }
    return "ROLE\n" +
      "You are a presentation and document design assistant built for one repeatable job: take any document you're given — a report, a proposal, a memo, a reading, an assignment brief — and convert it into a well-structured, clearly designed " + dm.agentToken + " that reflects the brand guidelines below. You will be used this way repeatedly, all semester, so stay consistent every time.\n\n" +
      "SCOPE\n" +
      "- Do this: convert documents into a " + dm.agentToken + " in this brand style, following the workflow below.\n" +
      "- Don't do this: invent content that isn't in the source document, change the underlying meaning or argument of the material, or take on requests unrelated to this conversion task — if asked for something outside this scope, say so rather than guessing at what's wanted.\n\n" +
      "BRAND GUIDELINES\n" +
      "Title Font: " + b.titleFont + "\n" +
      "Body Font: " + b.bodyFont + "\n" +
      "Primary Color: " + b.primaryColor + "\n" +
      "Secondary Color: " + b.secondaryColor + "\n" +
      "Background/Neutral Color: " + b.neutralColor + "\n" +
      "Focal/Contrast Color: " + b.focalColor + "\n" +
      "Graphic Style: " + b.graphicStyle + "\n" +
      "Visual Approach: Modern and minimal, with strong, deliberate visual hierarchy:\n" + visualHierarchyRules() + "\n\n" +
      "WORKFLOW\n" +
      "Follow these steps in order, every time:\n" +
      "1. If not already answered, ask:\n   - Who is the intended audience?\n   - How many slides or sections should the output target?\n   - What tone should the presentation or document use?\n" +
      "2. Read the source document and identify its natural structure.\n" +
      "3. Summarize that structure briefly (a short numbered list) so it can be confirmed before you build the full output — don't skip this step.\n" +
      "4. Once confirmed, generate the complete output using the OUTPUT FORMAT below.\n" +
      "5. Produce it as an actual file per OUTPUT DELIVERABLE.\n" +
      "6. Run the QUALITY CHECK below and fix anything that doesn't pass before delivering the final version.\n\n" +
      outputSections +
      "OUTPUT DELIVERABLE\n" + fileDeliverableNote(deliverable) + "\n\n" +
      "QUALITY CHECK — confirm all of these before presenting your final version:\n" + qualityCheckBlock() + "\n\n" +
      "RULES\n" +
      "- Do not fabricate information that isn't in the source document.\n" +
      "- If a section is ambiguous, note it rather than guessing.\n" +
      "- Keep language plain and avoid repeating the same content across sections or slides.\n" +
      "- Apply the brand guidelines to every design recommendation and note, with no exceptions.";
  }

  // Suggested Name + Description for the agent/project/GPT -- shown as
  // plain-language suggestions inline in the steps (short enough that a
  // dedicated copy button would be overkill).
  function agentNameAndDescription(deliverable){
    var names = { slides: "Slide Deck Design Assistant", document: "Document Design Assistant", both: "Course Design Assistant" };
    var dm = DELIVERABLE_META[deliverable];
    return {
      name: names[deliverable],
      description: "Turns any document into a branded, well-designed " + dm.outline + " that follows our visual style."
    };
  }

  // Short quick-click starter phrases for ChatGPT's "Conversation starters"
  // and Copilot's "Suggested prompts" builder fields.
  function starterPrompts(deliverable){
    if(deliverable === "document") return ["Turn this document into a document outline", "Here's my rough outline — build it into a document outline"];
    if(deliverable === "both") return ["Turn this document into a slide deck outline", "Turn this document into a document outline"];
    return ["Turn this document into a slide deck outline", "Here's my rough outline — build it into a slide deck"];
  }

  // Full messages to send once the agent/project/GPT is actually built and
  // ready to use, day-to-day, for the rest of the semester.
  function usagePrompts(deliverable){
    var dm = DELIVERABLE_META[deliverable];
    var lengthUnit = deliverable === "document" ? "sections" : (deliverable === "both" ? "slides/sections" : "slides");
    return [
      { title: "Usage Prompt · Quick Version", text: "Please convert the attached document into a " + dm.outline + ", following your brand guidelines and workflow. Provide it as an actual downloadable file, not just a summary." },
      { title: "Usage Prompt · Fill In The Details", text: "Please convert the attached document into a " + dm.outline + ", following your brand guidelines and workflow.\n\nAudience: [fill in]\nTarget length: [fill in] " + lengthUnit + "\nTone: [fill in]\n\nProvide it as an actual downloadable file, not just a summary." }
    ];
  }

  function copilotFileFallback(deliverable){
    var extraTip = deliverable === "document"
      ? ' You can also paste the confirmed outline into Copilot inside Word itself (Home tab → Copilot) if you\'d rather build it there directly.'
      : (deliverable === "slides"
        ? ' You can also paste the confirmed outline into Copilot inside PowerPoint itself (Home tab → Copilot → "Create presentation from text") if you\'d rather build it there directly.'
        : ' You can also paste the confirmed outline into Copilot inside PowerPoint or Word directly (Home tab → Copilot) if you\'d rather build it there.');
    return 'Copilot can generate ' + filePhrase(deliverable) + ' directly in the chat. If it only gives you plain text, ask: <em>"Please create this as ' + filePhrase(deliverable) + '."</em>' + extraTip;
  }

  function buildPrompts(deliverable, task, b, tool){
    if(task === "generate") return [{title:"Prompt 1 · Generate Your " + capitalize(DELIVERABLE_META[deliverable].outline), text: generatePromptText(deliverable, b)}];
    if(task === "improve") return [{title:"Prompt 1 · Improve Your Design", text: improvePromptText(deliverable, b)}];

    var prompts = [{title:"Your Reusable Agent System Prompt", text: agentPromptText(deliverable, b)}];
    var starters = starterPrompts(deliverable).join("\n");
    if(tool === "chatgpt") prompts.push({title:"Conversation Starters (for ChatGPT)", text: starters});
    if(tool === "copilot") prompts.push({title:"Suggested Prompts (for Copilot)", text: starters});
    usagePrompts(deliverable).forEach(function(p){ prompts.push(p); });
    return prompts;
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ---------------------------------------------------------------------
     PUBLIC API + INIT
  --------------------------------------------------------------------- */
  window.App = {
    goTo: goTo, startOver: startOver, toggleTheme: toggleTheme,
    selectDeliverable: selectDeliverable, selectTool: selectTool, toggleCanva: toggleCanva, selectTask: selectTask,
    useDefaults: useDefaults, openCustomize: openCustomize, finishCustomize: finishCustomize,
    copyPrompt: copyPrompt, downloadPdf: downloadPdf,
    selectPalette: selectPalette, applyGraphicSuggestion: applyGraphicSuggestion
  };

  render();
})();
